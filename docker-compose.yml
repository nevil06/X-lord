version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: land_order_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=land_order
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: land_order_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
